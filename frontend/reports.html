<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reports</title><style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#0f172a}.wrap{width:min(980px,94%);margin:24px auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px;box-shadow:0 16px 40px #0f172a14}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:18px}a{display:block;padding:14px;border-radius:14px;background:#dbeafe;color:#1d4ed8;text-decoration:none;font-weight:800}small{display:block;color:#475569;margin-top:5px;font-weight:600}.status{padding:12px;border-radius:12px;background:#f1f5f9;font-weight:700}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}</style></head><body><div class="wrap"><div class="card"><h1>📄 Case Report Vault</h1><p>All generated evidence artifacts for one investigation.</p><div id="status" class="status">Loading…</div><div id="links" class="links"></div></div></div><script>const id=new URLSearchParams(location.search).get('case_id');const status=document.getElementById('status');const links=document.getElementById('links');if(!id){status.className='status error';status.textContent='case_id required';}else{fetch(`/api/case/${encodeURIComponent(id)}/reports`).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);status.className='status ok';status.textContent=`✅ ${d.investigationId} · ${d.reports.length} artifacts`;links.innerHTML=d.reports.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.label}<small>${x.type.toUpperCase()} · direct access</small></a>`).join('');}).catch(e=>{status.className='status error';status.textContent='❌ '+e.message;});}</script></body></html>
