<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Graph</title><style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#e5eef8}header{padding:16px 20px;border-bottom:1px solid #183047;background:#0b1626;display:flex;gap:12px;align-items:center}input,button{padding:10px 12px;border-radius:10px;border:1px solid #28405a;background:#0e1b2d;color:#e5eef8}button{cursor:pointer}main{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 70px)}#graph{position:relative;overflow:hidden;background:radial-gradient(circle at center,#0c2035,#07111f 65%)}svg{width:100%;height:100%}.side{border-left:1px solid #183047;background:#0b1626;padding:16px;overflow:auto}.stat{padding:10px;border:1px solid #20364c;border-radius:10px;margin-bottom:10px}.lead{padding:10px;border:1px solid #334c64;border-radius:10px;margin:8px 0}.muted{color:#93a9bd;font-size:12px}.nodeLabel{font-size:11px;fill:#e5eef8}.edgeLabel{font-size:9px;fill:#8299ad}</style></head>
<body><header><strong>🕸 Evidence Graph</strong><input id="caseId" placeholder="Investigation ID" style="flex:1"><button id="load">Load Graph</button><a id="caseLink" style="color:#8ec5ff" target="_blank"></a></header><main><section id="graph"></section><aside class="side"><h3>Case Intelligence</h3><div id="stats"></div><h3>Relevant Leads</h3><div id="leads"></div></aside></main>
<script>
const host=location.hostname==='localhost'||location.hostname==='127.0.0.1'?'http://localhost:5001':`http://${location.hostname}:5001`;
const graphEl=document.getElementById('graph');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(g){const W=graphEl.clientWidth,H=graphEl.clientHeight,nodes=(g.nodes||[]).slice(0,120),edges=g.edges||[];const byId=new Map(nodes.map((n,i)=>[n.id,{...n,x:W/2+Math.cos(i/nodes.length*Math.PI*2)*Math.min(W,H)*.32,y:H/2+Math.sin(i/nodes.length*Math.PI*2)*Math.min(W,H)*.32}]));let out=`<svg viewBox="0 0 ${W} ${H}"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#5f7f9d"/></marker></defs>`;for(const e of edges){const a=byId.get(e.from),b=byId.get(e.to);if(!a||!b)continue;out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#36536e" stroke-width="1.5" marker-end="url(#a)"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" class="edgeLabel">${esc(e.relation)}</text>`}for(const n of byId.values()){const r=n.type==='CASE'?18:n.type==='SOURCE'?10:13;out+=`<g><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${n.type==='CASE'?'#e1a23a':n.type==='SOURCE'?'#4d88b8':'#2c6e93'}" stroke="#bfe1ff"/><text x="${n.x+r+4}" y="${n.y+4}" class="nodeLabel">${esc((n.label||n.type).slice(0,42))}</text></g>`}out+='</svg>';graphEl.innerHTML=out}
async function load(){const id=document.getElementById('caseId').value.trim();if(!id)return;const r=await fetch(`${host}/api/case/${encodeURIComponent(id)}/graph`);const d=await r.json();if(!r.ok)throw new Error(d.error);const g=d.graph;render(g);document.getElementById('stats').innerHTML=`<div class="stat"><b>Nodes</b> ${d.stats.nodes}<br><b>Edges</b> ${d.stats.edges}<br><b>Relevant leads</b> ${d.stats.leads}</div>`;document.getElementById('leads').innerHTML=(g.leads||[]).slice(0,25).map(x=>`<div class="lead"><b>${Math.round(x.score*100)}%</b> · ${esc(x.reason)}<div class="muted">${esc((x.matchedTerms||[]).join(', '))}</div></div>`).join('')||'<div class="muted">No leads above threshold.</div>';document.getElementById('caseLink').textContent='Open case JSON';document.getElementById('caseLink').href=`${host}/api/case/${encodeURIComponent(id)}`}
document.getElementById('load').onclick=()=>load().catch(e=>alert(e.message));
</script></body></html>
