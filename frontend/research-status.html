<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Research Status</title><style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#0f172a}.wrap{width:min(980px,94%);margin:20px auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.box{padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.box b{display:block;color:#64748b;font-size:12px}.box span{display:block;margin-top:4px;font-size:20px;font-weight:800}.round{margin-top:10px;padding:12px;border-left:4px solid #7c3aed;background:#faf5ff;border-radius:10px}.error{color:#991b1b}</style></head><body><div class="wrap"><div class="card"><h1>🔬 Deep Research Status</h1><div id="out">Loading…</div></div></div><script>const id=new URLSearchParams(location.search).get('case_id');const out=document.getElementById('out');if(!id){out.innerHTML='<p class="error">case_id required</p>'}else{fetch(`/api/case/${encodeURIComponent(id)}`).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);const x=d.deepResearch||{},l=d.evidenceLedger?.stats||{};out.innerHTML=`<div class="grid"><div class="box"><b>Rounds</b><span>${x.rounds?.length||0}</span></div><div class="box"><b>Sources</b><span>${x.sources?.length||0}</span></div><div class="box"><b>Primary verified</b><span>${l.verifiedPrimarySources||0}</span></div><div class="box"><b>Readiness</b><span>${l.readinessScore||0}%</span></div></div><h3>Research rounds</h3>${(x.rounds||[]).map(r=>`<div class="round"><b>Round ${r.round}</b><br>Queries: ${r.queries?.length||0} · Candidates: ${r.candidateCount||0} · Verified: ${r.verifiedCount||0} · High-value: ${r.highValueCount||0}</div>`).join('')}<p><b>Stopping reason:</b> ${x.stoppingReason||'N/A'}</p>`}).catch(e=>out.innerHTML='<p class="error">❌ '+e.message+'</p>')}</script></body></html>
