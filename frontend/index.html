<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Government Work Investigation AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #111827;
        }

        .container {
            width: min(900px, 94%);
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,.12);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #111827;
            border-radius: 16px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            padding: 14px 22px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            background: #fef3c7;
            color: #92400e;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        a {
            color: #2563eb;
        }

        .location {
            background: #eff6ff;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🇮🇳 Government Work Investigation AI</h1>

    <div class="subtitle">
        Photo + GPS + Timestamp → Initial Investigation
    </div>

    <video
        id="camera"
        autoplay
        muted
        playsinline
    ></video>

    <div class="controls">

        <button
            id="startCamera"
        >
            📷 Start Camera
        </button>

        <button
            id="investigate"
            disabled
        >
            🔍 Capture + Investigate
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        Backend checking...
    </div>

    <div
        id="location"
        class="location"
        style="display:none;"
    ></div>

    <div
        id="result"
        class="result"
        style="display:none;"
    ></div>

</div>

<script>

"use strict";

// --------------------------------------------------
// Backend URL
// --------------------------------------------------

function getBackendURL() {

    const host =
        window.location.hostname;

    if (
        host === "localhost" ||
        host === "127.0.0.1"
    ) {
        return "http://localhost:5000";
    }

    return `http://${host}:5000`;
}

const BACKEND_URL =
    getBackendURL();

console.log(
    "Backend:",
    BACKEND_URL
);

// --------------------------------------------------
// DOM
// --------------------------------------------------

const video =
    document.getElementById("camera");

const startCameraBtn =
    document.getElementById("startCamera");

const investigateBtn =
    document.getElementById("investigate");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");

const locationBox =
    document.getElementById("location");

let cameraStream = null;

// --------------------------------------------------
// Status
// --------------------------------------------------

function setStatus(
    message,
    type = ""
) {
    status.textContent =
        message;

    status.className =
        "status " + type;
}

// --------------------------------------------------
// Backend health
// --------------------------------------------------

async function checkBackend() {

    try {

        setStatus(
            "Backend check ho raha hai...",
            "loading"
        );

        const response =
            await fetch(
                `${BACKEND_URL}/api/health`,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        console.log(
            "Backend:",
            data
        );

        setStatus(
            "✅ Backend connected",
            "success"
        );

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            `❌ Backend connect nahi hua: ${BACKEND_URL}:5000`,
            "error"
        );
    }
}

// --------------------------------------------------
// Camera
// --------------------------------------------------

async function startCamera() {

    try {

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: {
                        facingMode:
                            {
                                ideal:
                                    "environment"
                            },
                        width: {
                            ideal: 1920
                        },
                        height: {
                            ideal: 1080
                        }
                    },
                    audio: false
                });

        video.srcObject =
            cameraStream;

        investigateBtn.disabled =
            false;

        setStatus(
            "📷 Camera ready",
            "success"
        );

    } catch (error) {

        console.error(
            "Camera:",
            error
        );

        setStatus(
            "❌ Camera permission nahi mili: " +
            error.message,
            "error"
        );
    }
}

// --------------------------------------------------
// GPS
// --------------------------------------------------

function getGPS() {

    return new Promise(
        (resolve, reject) => {

            if (
                !navigator.geolocation
            ) {
                reject(
                    new Error(
                        "GPS supported nahi hai."
                    )
                );

                return;
            }

            navigator.geolocation
                .getCurrentPosition(
                    resolve,
                    reject,
                    {
                        enableHighAccuracy:
                            true,

                        timeout:
                            20000,

                        maximumAge:
                            0
                    }
                );
        }
    );
}

// --------------------------------------------------
// Capture image
// --------------------------------------------------

function capturePhoto() {

    if (!video.videoWidth) {

        throw new Error(
            "Camera frame ready nahi hai."
        );
    }

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas.toDataURL(
        "image/jpeg",
        0.85
    );
}

// --------------------------------------------------
// Investigation
// --------------------------------------------------

async function investigate() {

    investigateBtn.disabled =
        true;

    result.style.display =
        "none";

    try {

        setStatus(
            "📍 GPS location li ja rahi hai...",
            "loading"
        );

        const position =
            await getGPS();

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const accuracy =
            position.coords.accuracy;

        const timestamp =
            new Date().toISOString();

        setStatus(
            "📸 Photo capture ho rahi hai...",
            "loading"
        );

        const photo =
            capturePhoto();

        locationBox.style.display =
            "block";

        locationBox.innerHTML = `
            <b>GPS</b><br>
            Latitude: ${latitude}<br>
            Longitude: ${longitude}<br>
            Accuracy: ${accuracy} meters<br>
            Timestamp: ${timestamp}
        `;

        setStatus(
            "🤖 Backend investigation start...",
            "loading"
        );

        const response =
            await fetch(
                `${BACKEND_URL}/api/start-investigation`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            latitude,
                            longitude,
                            timestamp,
                            photo
                        })
                }
            );

        const text =
            await response.text();

        let data;

        try {
            data =
                JSON.parse(text);
        } catch {
            throw new Error(
                `Backend ne invalid response diya: ${text}`
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );
        }

        console.log(
            "Investigation result:",
            data
        );

        result.style.display =
            "block";

        result.innerHTML = `
            <h3>✅ Investigation Complete</h3>

            <p>
                ${escapeHTML(
                    data.message || ""
                )}
            </p>

            <h4>📍 Location</h4>

            <pre>${escapeHTML(
                JSON.stringify(
                    data.location,
                    null,
                    2
                )
            )}</pre>

            <h4>🗺️ Maps</h4>

            <p>
                <a
                    href="${data.maps.googleMaps}"
                    target="_blank"
                >
                    Open Google Maps
                </a>
            </p>

            <p>
                <a
                    href="${data.maps.openStreetMap}"
                    target="_blank"
                >
                    Open OpenStreetMap
                </a>
            </p>

            <h4>📋 Research Plan</h4>

            <pre>${escapeHTML(
                JSON.stringify(
                    data.researchPlan,
                    null,
                    2
                )
            )}</pre>

            <h4>📄 Reports</h4>

            <pre>${escapeHTML(
                JSON.stringify(
                    data.reports,
                    null,
                    2
                )
            )}</pre>
        `;

        setStatus(
            "✅ Investigation complete",
            "success"
        );

    } catch (error) {

        console.error(
            "Investigation:",
            error
        );

        result.style.display =
            "block";

        result.innerHTML =
            `<b>❌ Error</b>\n\n${escapeHTML(
                error.message
            )}`;

        setStatus(
            "❌ Investigation failed",
            "error"
        );

    } finally {

        investigateBtn.disabled =
            false;
    }
}

// --------------------------------------------------
// HTML escaping
// --------------------------------------------------

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

// --------------------------------------------------
// Events
// --------------------------------------------------

startCameraBtn.addEventListener(
    "click",
    startCamera
);

investigateBtn.addEventListener(
    "click",
    investigate
);

// --------------------------------------------------
// Initial backend check
// --------------------------------------------------

checkBackend();

// --------------------------------------------------
// Stop camera
// --------------------------------------------------

window.addEventListener(
    "beforeunload",
    () => {

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }
    }
);

</script>

</body>
</html>
