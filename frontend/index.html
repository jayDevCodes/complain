<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🇮🇳 भ्रष्टाचार विरोधी AI सिस्टम</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 30px 28px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        /* ----- Header ----- */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .header .icon {
            font-size: 2.6rem;
            background: #1e293b;
            color: #facc15;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header h1 small {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            color: #475569;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* ----- Video ----- */
        .video-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background: #0b1120;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6), 0 12px 24px -8px rgba(0, 0, 0, 0.3);
            margin-bottom: 22px;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #0b1120;
        }

        .video-placeholder {
            color: #94a3b8;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px;
            text-align: center;
        }

        .video-placeholder i {
            font-size: 3.6rem;
            color: #475569;
        }

        /* ----- Controls ----- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            background: #1e293b;
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 18px -6px rgba(15, 23, 42, 0.25);
            flex: 1 1 auto;
            min-width: 180px;
        }

        .btn i {
            font-size: 1.2rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #0f172a;
            box-shadow: 0 14px 24px -8px rgba(15, 23, 42, 0.35);
        }

        .btn:active {
            transform: translateY(0px);
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(0.3);
            transform: none !important;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #475569;
            background: #e2e8f0;
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green {
            background: #22c55e;
        }
        .dot.yellow {
            background: #eab308;
        }
        .dot.red {
            background: #ef4444;
        }

        /* ----- Result Box ----- */
        .result-box {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px 24px;
            border: 1px solid #e2e8f0;
            min-height: 140px;
            max-height: 520px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #0f172a;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .result-box::-webkit-scrollbar {
            width: 6px;
        }

        .result-box::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 12px;
        }

        .result-box::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 12px;
        }

        .result-placeholder {
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 100%;
            min-height: 100px;
            text-align: center;
        }

        .result-placeholder i {
            font-size: 2.4rem;
            color: #cbd5e1;
        }

        .result-box .section-title {
            font-weight: 700;
            font-size: 1rem;
            color: #0f172a;
            margin-top: 16px;
            margin-bottom: 4px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .result-box .section-title:first-of-type {
            margin-top: 0;
        }

        .result-box .drive-link {
            display: block;
            color: #2563eb;
            word-break: break-all;
            padding: 2px 0;
        }

        .result-box .drive-link i {
            margin-right: 6px;
            color: #16a34a;
        }

        .result-box .rti-draft {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 4px solid #2563eb;
            margin: 8px 0;
        }

        .error-message {
            color: #dc2626;
            background: #fee2e2;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 4px solid #dc2626;
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer a {
            color: #475569;
            text-decoration: none;
        }

        .footer a:hover {
            color: #0f172a;
            text-decoration: underline;
        }

        /* ----- Responsive ----- */
        @media (max-width: 550px) {
            .container {
                padding: 20px 16px 28px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .header .icon {
                width: 48px;
                height: 48px;
                font-size: 2rem;
            }

            .btn {
                padding: 12px 18px;
                font-size: 0.9rem;
                min-width: 140px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .status-badge {
                align-self: flex-start;
            }
        }

        /* ----- Utility ----- */
        .mt-2 {
            margin-top: 8px;
        }
        .mb-1 {
            margin-bottom: 4px;
        }
        .flex {
            display: flex;
        }
        .gap-2 {
            gap: 8px;
        }
        .items-center {
            align-items: center;
        }
        .text-sm {
            font-size: 0.85rem;
        }
        .text-muted {
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="icon">
                <i class="fas fa-balance-scale"></i>
            </div>
            <h1>
                भ्रष्टाचार विरोधी AI
                <small>सरकारी टेंडर जांच प्रणाली</small>
            </h1>
        </div>

        <!-- VIDEO -->
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <div id="videoPlaceholder" class="video-placeholder" style="position:absolute; inset:0; pointer-events:none; background:rgba(11,17,32,0.7); backdrop-filter:blur(4px);">
                <i class="fas fa-video"></i>
                <span>कैमरा शुरू हो रहा है…</span>
                <span style="font-size:0.8rem; color:#64748b;">कृपया अनुमति दें</span>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button id="captureBtn" class="btn btn-primary">
                <i class="fas fa-camera"></i> GPS + जाँच शुरू करें
            </button>
            <span id="statusBadge" class="status-badge">
                <span class="dot yellow" id="statusDot"></span>
                <span id="statusText">तैयार</span>
            </span>
        </div>

        <!-- RESULT -->
        <div id="resultBox" class="result-box">
            <div class="result-placeholder" id="placeholder">
                <i class="fas fa-search"></i>
                <span>जाँच के नतीजे यहाँ दिखेंगे</span>
                <span style="font-size:0.8rem; color:#94a3b8;">कैमरा और GPS सक्षम होना चाहिए</span>
            </div>
            <div id="resultContent" style="display:none;"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span><i class="fas fa-shield-alt" style="color:#2563eb;"></i> डेटा स्थानीय रूप से संसाधित होता है</span>
            <span>
                <i class="fas fa-code"></i> <a href="https://github.com/jayDevCodes/complain" target="_blank">GitHub</a>
                &middot; v2.0
            </span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ---------- DOM refs ----------
            const video = document.getElementById('video');
            const placeholder = document.getElementById('videoPlaceholder');
            const captureBtn = document.getElementById('captureBtn');
            const statusBadge = document.getElementById('statusBadge');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const resultBox = document.getElementById('resultBox');
            const placeholderEl = document.getElementById('placeholder');
            const resultContent = document.getElementById('resultContent');

            // ---------- State ----------
            let isInvestigating = false;

            // ---------- Helpers ----------
            function setStatus(text, type) {
                statusText.textContent = text;
                statusDot.className = 'dot';
                if (type === 'ready') {
                    statusDot.classList.add('green');
                    statusBadge.style.background = '#dcfce7';
                } else if (type === 'loading') {
                    statusDot.classList.add('yellow');
                    statusBadge.style.background = '#fef9c3';
                } else if (type === 'error') {
                    statusDot.classList.add('red');
                    statusBadge.style.background = '#fee2e2';
                } else {
                    statusDot.classList.add('green');
                    statusBadge.style.background = '#e2e8f0';
                }
            }

            function showResult(html) {
                placeholderEl.style.display = 'none';
                resultContent.style.display = 'block';
                resultContent.innerHTML = html;
            }

            function showPlaceholder() {
                placeholderEl.style.display = 'flex';
                resultContent.style.display = 'none';
                resultContent.innerHTML = '';
            }

            function formatDriveLinks(links) {
                if (!links || links.length === 0) return '<span class="text-muted">कोई लिंक नहीं</span>';
                return links.map(link =>
                    `<span class="drive-link"><i class="fas fa-file-pdf"></i> <a href="${link}" target="_blank">${link}</a></span>`
                ).join('');
            }

            function formatLocation(loc) {
                if (!loc) return 'N/A';
                const parts = [];
                if (loc.display_name) parts.push(`📍 ${loc.display_name}`);
                if (loc.city) parts.push(`🏙️ ${loc.city}`);
                if (loc.district) parts.push(`🗺️ ${loc.district}`);
                if (loc.state) parts.push(`🏛️ ${loc.state}`);
                if (loc.pincode) parts.push(`📮 ${loc.pincode}`);
                if (loc.latitude && loc.longitude) parts.push(`🌐 ${loc.latitude}, ${loc.longitude}`);
                return parts.length ? parts.join('<br>') : JSON.stringify(loc, null, 2);
            }

            // ---------- Camera ----------
            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 } }
                    });
                    video.srcObject = stream;
                    if (placeholder) placeholder.style.display = 'none';
                    setStatus('कैमरा ऑन', 'ready');
                } catch (err) {
                    console.warn('Camera error:', err);
                    if (placeholder) {
                        placeholder.innerHTML = `
                            <i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i>
                            <span>कैमरा एक्सेस नहीं मिला</span>
                            <span style="font-size:0.8rem; color:#94a3b8;">${err.message}</span>
                        `;
                        placeholder.style.display = 'flex';
                    }
                    setStatus('कैमरा बंद', 'error');
                }
            }

            // ---------- Investigation ----------
            async function startInvestigation() {
                if (isInvestigating) return;

                // GPS check
                if (!navigator.geolocation) {
                    alert('आपका ब्राउज़र GPS सपोर्ट नहीं करता।');
                    return;
                }

                isInvestigating = true;
                captureBtn.disabled = true;
                captureBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> जाँच हो रही…';
                setStatus('GPS लिया जा रहा…', 'loading');
                showPlaceholder();

                try {
                    // 1. Get GPS
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 15000,
                            maximumAge: 0
                        });
                    });

                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const timestamp = new Date().toISOString();

                    setStatus('AI विश्लेषण…', 'loading');
                    captureBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI सोच रहा…';

                    // 2. Call backend (PORT 501)
                    const BACKEND_URL = 'http://localhost:501/api/start-investigation';
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude: lat, longitude: lon, timestamp })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`सर्वर एरर (${response.status}): ${errText}`);
                    }

                    const data = await response.json();

                    // 3. Render result
                    let html = '';

                    // Location
                    html += `<div class="section-title"><i class="fas fa-map-pin" style="color:#2563eb;"></i> स्थान</div>`;
                    html += `<div style="margin-bottom:12px;">${formatLocation(data.location)}</div>`;

                    // AI Summary
                    if (data.aiSummary) {
                        html += `<div class="section-title"><i class="fas fa-brain" style="color:#7c3aed;"></i> AI विश्लेषण</div>`;
                        html += `<div style="margin-bottom:12px; background:#f1f5f9; padding:10px 14px; border-radius:16px;">${data.aiSummary}</div>`;
                    }

                    // Drive links
                    if (data.driveLinks && data.driveLinks.length) {
                        html += `<div class="section-title"><i class="fas fa-cloud-upload-alt" style="color:#16a34a;"></i> PDF रिपोर्ट</div>`;
                        html += `<div style="margin-bottom:12px;">${formatDriveLinks(data.driveLinks)}</div>`;
                    } else {
                        html +=
                            `<div class="section-title"><i class="fas fa-file-pdf" style="color:#f59e0b;"></i> PDF रिपोर्ट</div>`;
                        html +=
                            `<div class="text-muted text-sm">कोई Drive लिंक नहीं (स्थानीय PDF जनरेट हुई)</div>`;
                    }

                    // RTI Draft
                    if (data.rtiDraft) {
                        html += `<div class="section-title"><i class="fas fa-gavel" style="color:#b45309;"></i> RTI ड्राफ्ट</div>`;
                        html += `<div class="rti-draft">${data.rtiDraft}</div>`;
                    }

                    showResult(html);
                    setStatus('जाँच पूरी ✅', 'ready');

                } catch (err) {
                    console.error('Investigation error:', err);
                    let errorMsg = err.message || 'अज्ञात त्रुटि';
                    if (errorMsg.includes('Failed to fetch')) {
                        errorMsg =
                        'बैकएंड सर्वर कनेक्ट नहीं हो पाया। क्या सर्वर चल रहा है? (पोर्ट 501)';
                    }
                    showResult(`
                        <div class="error-message">
                            <i class="fas fa-exclamation-circle"></i> ${errorMsg}
                        </div>
                        <div class="text-sm text-muted mt-2">
                            <i class="fas fa-lightbulb"></i> सुझाव: सर्वर चालू है? <code>node app.js</code> चलाएँ और पोर्ट 501 चेक करें।
                        </div>
                    `);
                    setStatus('एरर ❌', 'error');
                } finally {
                    isInvestigating = false;
                    captureBtn.disabled = false;
                    captureBtn.innerHTML = '<i class="fas fa-camera"></i> GPS + जाँच शुरू करें';
                }
            }

            // ---------- Event binding ----------
            captureBtn.addEventListener('click', startInvestigation);

            // ---------- Init ----------
            startCamera();
            setStatus('तैयार', 'ready');

            // Handle page unload – stop camera
            window.addEventListener('beforeunload', () => {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                }
            });

        })();
    </script>

</body>
</html>
