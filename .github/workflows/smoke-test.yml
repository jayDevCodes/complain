name: Backend Smoke Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Start server
        run: |
          PORT=5000 node app.js > /tmp/complain-server.log 2>&1 &
          echo $! > /tmp/complain-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/complain-server.log
          exit 1

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/complain-server.log || true
