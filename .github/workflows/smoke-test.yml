name: Backend Smoke Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Full backend demo
        run: node demo-smoke.js

      - name: Show server-side case tree on failure
        if: failure()
        run: |
          find cases reports -maxdepth 2 -type f -print 2>/dev/null || true
