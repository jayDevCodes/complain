name: Backend port consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PORT: 5001

jobs:
  port-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check active 5000 port references
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -n -E '(127\.0\.0\.1|localhost)(:|/).*5000|(^|[^0-9])PORT[ =:]*5000([^0-9]|$)|PORT[=:]["'\''`]5000["'\''`]' -- \
            ':!backend/node_modules/**' \
            ':!.git/**' || true)

          if [ -n "$matches" ]; then
            echo 'Found active backend port references using 5000:'
            printf '%s\n' "$matches"
            echo 'Use PORT=5001 / localhost:5001 consistently.'
            exit 1
          fi

          echo 'Port consistency check passed: no active 5000 references found.'
