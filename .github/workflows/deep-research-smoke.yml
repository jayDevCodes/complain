name: Deep research smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PORT: 5001
  DEEP_RESEARCH_ROUNDS: 2
  DEEP_RESEARCH_RESULTS_PER_QUERY: 4
  DEEP_RESEARCH_MAX_QUERIES_PER_ROUND: 12

jobs:
  deep-research-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Deep research full smoke
        working-directory: backend
        run: node demo-smoke.js

      - name: Generated-data cleanup smoke
        working-directory: backend
        run: node cleanup-smoke.js
